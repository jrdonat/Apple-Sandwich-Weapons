name: Validate weapon data

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate repository
        run: npm run validate

      - name: Build payloads
        shell: bash
        run: npm run build -- --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --commit "$GITHUB_SHA"

      - name: Upload generated payloads
        uses: actions/upload-artifact@v7
        with:
          name: weapon-payloads
          path: dist/
          if-no-files-found: error
